<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ArithmaSchool: Petualangan Gaussy - Media Pembelajaran Barisan & Deret Aritmatika (Fase E / Kelas 10)</title>

  <!-- Google Fonts: Titan One, Luckiest Guy, Fredoka, Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800;900&family=Luckiest+Guy&family=Nunito:wght@400;600;700;800;900&family=Titan+One&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 & Confetti CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- KaTeX (Render Rumus Matematika LaTeX) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="if(window.typesetMath) window.typesetMath();"></script>

  <!-- ======================================================================
       FILE CSS MODULAR (TAMPILAN, WARNA, TOMBOL, KOMPONEN)
       ====================================================================== -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- ==========================================================================
       WADAH PANGGUNG UTAMA (ASPECT RATIO 16:9 PRESI DENGAN LATAR SEKOLAH)
       ========================================================================== -->
  <main id="app-viewport">

    <!-- Top Floating Utility Bar -->
    <header class="top-utility-bar">
      <div class="logo-badge">
        <span class="badge-icon"><i class="fa-solid fa-graduation-cap"></i></span>
        <span>ArithmaSchool 🦉 Gaussy</span>
      </div>

      <div class="top-controls">
         <button id="btn-sound-toggle" class="icon-round-btn" title="Efek Suara SFX" onclick="toggleSound()">
          <i class="fa-solid fa-volume-high" id="sound-icon"></i>
        </button>
        <button id="btn-bgm-toggle" class="icon-round-btn" title="Musik Latar Arcade BGM" onclick="toggleBGM()">
          <i class="fa-solid fa-music" id="bgm-icon"></i>
        </button>
      </div>
    </header>

    <!-- Floating Audio Status Toast Pill -->
    <div id="audio-toast" class="audio-toast">
      <i class="fa-solid fa-volume-high" id="audio-toast-icon"></i>
      <span id="audio-toast-text">Efek Suara Aktif</span>
    </div>

    <!-- ========================================================================
         WADAH HALAMAN KOSONG:
         Seluruh Halaman (1 s.d 10) Otomatis Dimuat dari Folder pages/
         ======================================================================== -->
    <div id="pages-container">
      <!-- Di-load secara dinamis oleh js/page-loader.js -->
    </div>

  </main>


  <!-- Global Modal Popup -->
  <div id="arcade-modal" class="arcade-modal-backdrop">
    <div class="arcade-modal-card">
      <div id="modal-icon-wrap" style="font-size: 42px; margin-bottom: 6px;">🎉</div>
      <h3 id="modal-title" style="font-family: var(--font-arcade); font-size: 19px; font-weight: 700; color: var(--dark-outline); margin-bottom: 6px;">Judul Modal</h3>
      <div id="modal-message" style="font-size: 12.5px; font-weight: 700; color: var(--text-muted); line-height: 1.45; margin-bottom: 16px; text-align: left; max-height: 250px; overflow-y: auto;">Pesan modal di sini...</div>
      
      <div id="modal-actions" style="display: flex; gap: 10px; justify-content: center;">
        <button id="modal-btn-confirm" class="arcade-btn btn-mint btn-sm" onclick="closeModal()">OK, SIAP!</button>
      </div>
    </div>
  </div>


  <!-- ======================================================================
       FILE JAVASCRIPT MODULAR (LOADER, DATABASE, AUDIO, NAVIGASI, GAME)
       ====================================================================== -->
  <!-- Firebase SDK (Realtime Database, kompatibel-browser / compat build) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/page-loader.js"></script>
  <script src="js/database.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
